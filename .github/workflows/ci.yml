name: CI

# The same checks CONTRIBUTING.md asks for before a pull request. None of them
# need secrets, a database or the model artifact: tests use in-memory doubles,
# and the ML service's real-model tests are opt-in (RUN_MODEL_INTEGRATION=1).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # tsc, ESLint, Vitest and next build run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:ui
      - run: bun run a11y:contrast
      - run: bun run build

  ml-service:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ml-service/.python-version
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  database:
    name: Database scripts (MongoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs database/init/*.js in mongosh against a throwaway mongo:7
      # container: schema apply and re-apply, demo seed validity, idempotency,
      # the real-user guard and removal.
      - run: scripts/db/check-init-scripts.sh

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
