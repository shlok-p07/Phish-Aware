name: Mirror Khoury main

# Schedule disabled deliberately -- see below. Run it by hand from the Actions
# tab when you actually want to pull Khoury's tree down.
#
# This job syncs the working tree FROM Khoury with `rsync -a --delete`, so every
# run makes this repo's main identical to Khoury's and commits the result. That
# is correct for a read-only mirror, and destructive once anyone develops here:
# on 2026-09-18 it reverted 29 files of work on main (commit a429e24), which had
# to be restored by reverting the mirror commit.
#
# Development now happens in this repo, so the twice-daily run can only undo it.
# Re-enable the cron only if this repo goes back to being a pure mirror -- and if
# it does, move development to Khoury first.
on:
  # schedule:
  #   - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (mirror target)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up deploy key for Khoury
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KHOURY_DEPLOY_KEY }}" > ~/.ssh/khoury_deploy_key
          chmod 600 ~/.ssh/khoury_deploy_key
          ssh-keyscan -H github.khoury.northeastern.edu >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone latest Khoury main
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/khoury_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main \
            git@github.khoury.northeastern.edu:CS4530-Summer-2-2026/Phish-Aware.git \
            "${{ runner.temp }}/khoury-src"

      - name: Sync working tree from Khoury (keep .git and this workflow dir untouched)
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "${{ runner.temp }}/khoury-src/" ./
          rm -rf "${{ runner.temp }}/khoury-src"

      - name: Commit and push if anything changed
        run: |
          git config user.name "khoury-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date with Khoury main."
          else
            git commit -m "Mirror Khoury main"
            git push origin HEAD:main
          fi
