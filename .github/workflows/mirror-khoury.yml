name: Mirror Khoury main

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (mirror target)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up deploy key for Khoury
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KHOURY_DEPLOY_KEY }}" > ~/.ssh/khoury_deploy_key
          chmod 600 ~/.ssh/khoury_deploy_key
          ssh-keyscan -H github.khoury.northeastern.edu >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone latest Khoury main
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/khoury_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main \
            git@github.khoury.northeastern.edu:CS4530-Summer-2-2026/Phish-Aware.git \
            "${{ runner.temp }}/khoury-src"

      - name: Sync working tree from Khoury (keep .git and this workflow dir untouched)
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "${{ runner.temp }}/khoury-src/" ./
          rm -rf "${{ runner.temp }}/khoury-src"

      - name: Commit and push if anything changed
        run: |
          git config user.name "khoury-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date with Khoury main."
          else
            git commit -m "Mirror Khoury main"
            git push origin HEAD:main
          fi
