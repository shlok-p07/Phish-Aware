openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PhishAware API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: onboarding
    description: Onboarding diagnostic quiz
  - name: lessons
    description: Learn library
  - name: practice
    description: Practice loop
  - name: dashboard
    description: Dashboard summary
  - name: profile
    description: Analytics / susceptibility profile
  - name: leaderboard
    description: Leaderboard
  - name: org
    description: Organization admin (members, training campaigns, analytics)
  - name: invitations
    description: "Org invitations: issuing them (admin) and accepting them (public)"
  - name: sso
    description: Per-organization OIDC single sign-on
  - name: chatbot
    description: Groq-powered security-awareness assistant
paths:
  # NOTE: browser-navigation endpoints deliberately absent from this spec:
  #   GET /auth/sso/start     302 -> the org's identity provider
  #   GET /auth/sso/callback  302 -> /dashboard or /auth?sso_error=<code>
  # Both are top-level browser navigations, not fetches. Generating react-query
  # hooks for them would produce clients that fetch() the URL, transparently
  # follow the redirect to a cross-origin IdP, and fail with an opaque CORS
  # error. The UI navigates to them with window.location.href instead.

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: >
        Reports whether the app can actually serve traffic, which means the
        database is reachable. /healthz deliberately does not check this -- it
        answers "is the process up" -- so an uptime monitor pointed at it
        reported healthy while the one dependency the app cannot work without
        was down.

        Always returns 200: this is a status document, not an error. Callers read
        the `ready` field. Mirrors the ML service's /healthz + /readyz split.

        Doubles as the cluster keepalive. MongoDB Atlas pauses a free-tier
        cluster after 60 days without activity, so a scheduled request here also
        keeps it awake (see vercel.json crons).
      responses:
        "200":
          description: Readiness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: >
        Carries the caller's org workspace customisation alongside their
        identity. The app shell already awaits this request, so branding
        arrives with the first render rather than causing a flash of
        unbranded UI on every page load.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      workspace:
                        allOf:
                          - $ref: "#/components/schemas/OrgWorkspace"
                        nullable: true
                        description: Null for a learner with no organisation.
        "401":
          description: Not authenticated

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input or email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email + password
      description: >-
        Five consecutive wrong passwords lock the account for 30 minutes and
        require a password reset. While locked, sign-in is refused before the
        password is even checked (423); once the lock expires the reset is still
        required (403). Both bodies carry a machine-readable `code`
        (`ACCOUNT_LOCKED` / `PASSWORD_RESET_REQUIRED`). A successful password
        reset clears the lock immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "403":
          description: Account disabled, invitation not finished, or a password reset is required after a lockout
        "423":
          description: Locked out after too many failed sign-in attempts

  /auth/account:
    delete:
      operationId: deleteMyAccount
      tags: [auth]
      summary: Permanently delete the current user's account and all their data
      description: >
        Removes the user, every practice attempt, every session and every
        training assignment, then clears the session cookie. Irreversible.
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset code
      description: >
        There is no mail delivery in this app. Outside production the code is
        returned directly and shown in the UI. In production it never is, and the
        response is identical whether or not the address has an account -- see
        POST /org/members/{id}/reset-code for the path that works there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: The reset code, if an account exists for that email (null otherwise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestOutput"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirm a password reset with the emailed code and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password updated
        "400":
          description: Invalid or expired code

  /auth/guest:
    post:
      operationId: continueAsGuest
      tags: [auth]
      summary: Start a guest session
      responses:
        "201":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and clear the session
      responses:
        "204":
          description: Logged out

  /onboarding/quiz:
    get:
      operationId: getOnboardingQuiz
      tags: [onboarding]
      summary: Get the 5-question onboarding diagnostic quiz
      responses:
        "200":
          description: Onboarding quiz questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingQuestion"

  /onboarding/submit:
    post:
      operationId: submitOnboardingQuiz
      tags: [onboarding]
      summary: Submit onboarding quiz answers and receive a starting level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingSubmitInput"
      responses:
        "200":
          description: Onboarding result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResult"

  /lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List all lessons in the learn library
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonSummary"

  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      tags: [lessons]
      summary: Record that the current user has finished a lesson
      description: >
        Idempotent. Re-reading a lesson does not create a second completion and
        does not move the original completedAt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completion recorded
          content:
            application/json:
              schema:
                type: object
                required: [completed]
                properties:
                  completed:
                    type: boolean
        "401":
          description: Not authenticated
        "404":
          description: No such lesson

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a single lesson with its screens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Lesson not found

  /practice/cue-options:
    get:
      operationId: listCueOptions
      tags: [practice]
      summary: List the canonical set of selectable red-flag cues
      responses:
        "200":
          description: Cue options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CueOption"

  /practice/next:
    get:
      operationId: getNextPracticeScenario
      tags: [practice]
      summary: Get the next recommended practice scenario for the current user
      parameters:
        - name: vector
          in: query
          required: false
          description: Which vector to practice -- a specific one, or "mixed" (default) to keep randomizing every round.
          schema:
            type: string
            enum: [email, sms, voice, qr, social, web, mixed]
      responses:
        "200":
          description: Next practice scenario (answer withheld)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeScenario"
        "401":
          description: Not authenticated

  /practice/attempts:
    post:
      operationId: submitAttempt
      tags: [practice]
      summary: Submit a verdict, selected cues, and confidence for a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAttemptInput"
      responses:
        "200":
          description: Graded attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "401":
          description: Not authenticated
        "404":
          description: Scenario not found

  /chatbot:
    post:
      operationId: sendChatbotMessage
      tags: [chatbot]
      summary: Send a message to the security-awareness assistant and get a reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotResponse"
        "401":
          description: Not authenticated
        "503":
          description: Assistant temporarily unavailable

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current user's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated

  /profile/analytics:
    get:
      operationId: getAnalytics
      tags: [profile]
      summary: Get the current user's susceptibility profile / analytics
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          description: Not authenticated

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get the XP leaderboard, scoped to the caller's department or organisation
      parameters:
        - in: query
          name: scope
          required: false
          description: >
            Which population to rank against. Defaults to `department` when the
            caller has one, otherwise `organization`. An organisation boundary is
            always applied regardless: a caller never sees another tenant.
          schema:
            type: string
            enum: [department, organization]
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /org:
    get:
      operationId: getOrg
      tags: [org]
      summary: Get the current user's organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          description: Not authenticated
        "404":
          description: The current user doesn't belong to an organization yet
    post:
      operationId: createOrg
      tags: [org]
      summary: Create an organization and become its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          description: Not authenticated
        "409":
          description: The current user already belongs to an organization
    delete:
      operationId: deleteOrg
      tags: [org]
      summary: Delete the organization (unassigns members, removes training data)
      responses:
        "204":
          description: Organization deleted
        "403":
          description: Admin access required

  /org/settings:
    patch:
      operationId: updateOrgSettings
      tags: [org]
      summary: Update organization name, SSO domain, or seat limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgSettingsInput"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "403":
          description: Admin access required

  /consents:
    get:
      operationId: listMyConsents
      tags: [consents]
      summary: What the current user has been asked, and what they answered
      responses:
        "200":
          description: Policies and their current standing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStatus"
        "401":
          description: Not authenticated
    patch:
      operationId: recordMyConsent
      tags: [consents]
      summary: Record a consent decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecisionInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentDecisionInput"
        "400":
          description: Unknown policy, or a non-boolean decision
        "401":
          description: Not authenticated
        "409":
          description: >
            The policy is required for the product to function and cannot be
            declined; withdrawing it means deleting the account.

  /notifications:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: The current user's notifications, newest first
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Not authenticated
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications read
      description: >
        Omit `ids` to mark every unread one. Ownership comes from the session, not
        from the ids -- an id list from a client is not proof of anything.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadInput"
      responses:
        "200":
          description: How many were updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsMarkedResult"
        "401":
          description: Not authenticated

  /org/audit:
    get:
      operationId: listOrgAuditLog
      tags: [org]
      summary: The organization's audit trail, newest first
      description: >
        Privileged actions taken inside this organization -- role changes,
        department moves, removals, issued reset codes, campaigns, settings.
        Records that a reset code was issued, never the code.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "403":
          description: Admin access required

  /org/departments:
    get:
      operationId: listOrgDepartments
      tags: [org]
      summary: The organization's departments
      description: >
        Organization-owned records. A new organization starts from the ten
        standard names, which map to attack types; anything added beyond those is
        honoured everywhere a department is used and falls back to the universal
        attack set.
      responses:
        "200":
          description: Departments, alphabetically, with a headcount each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgDepartment"
        "403":
          description: Admin access required
    post:
      operationId: createOrgDepartment
      tags: [org]
      summary: Add a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDepartment"
        "400":
          description: Missing or over-long name
        "403":
          description: Admin access required
        "409":
          description: A department with that name already exists

  /org/departments/{id}:
    patch:
      operationId: renameOrgDepartment
      tags: [org]
      summary: Rename a department, carrying its members with it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDepartmentSummary"
        "400":
          description: Missing or over-long name
        "403":
          description: Admin access required
        "404":
          description: Department not found
        "409":
          description: A department with that name already exists
    delete:
      operationId: deleteOrgDepartment
      tags: [org]
      summary: Delete a department; its members become unassigned
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin access required
        "404":
          description: Department not found

  /org/members:
    get:
      operationId: listOrgMembers
      tags: [org]
      summary: List members and pending invitations, with real accuracy/risk stats
      description: >
        A merged list. Rows with kind="member" are user accounts; rows with
        kind="invitation" are outstanding invitations that nobody has accepted
        yet. Their `id` fields come from different collections, so callers must
        branch on `kind` before calling any per-row endpoint.
      responses:
        "200":
          description: Members and pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "403":
          description: Admin access required
    post:
      operationId: inviteOrgMember
      tags: [org]
      summary: Invite a member (creates a pending invitation and returns its link)
      description: >
        Creates an invitation, not a user account. The response carries the
        accept link exactly once, at the moment the admin needs to copy it,
        the members list deliberately omits it. Use /org/invitations/{id}/link
        to retrieve it again later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteMemberResult"
        "403":
          description: Admin access required, or the organization is out of seats
        "409":
          description: Already a member, or already has a pending invitation

  /org/invitations/{id}:
    delete:
      operationId: revokeOrgInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation revoked
        "403":
          description: Admin access required
        "404":
          description: Invitation not found

  /org/invitations/{id}/link:
    post:
      operationId: getOrgInvitationLink
      tags: [invitations]
      summary: Retrieve an existing invitation's accept link
      description: >
        POST rather than GET so react-query won't cache a bearer token in the
        client. The token is unchanged; use /resend to rotate it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
        "403":
          description: Admin access required
        "404":
          description: Invitation not found
        "410":
          description: Invitation is no longer pending

  /org/invitations/{id}/resend:
    post:
      operationId: resendOrgInvitation
      tags: [invitations]
      summary: Rotate an invitation's token and extend its expiry
      description: >
        Issues a brand-new token, invalidating the previous link. This is the
        "I think that link leaked" action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
        "403":
          description: Admin access required
        "404":
          description: Invitation not found
        "410":
          description: Invitation is no longer pending

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Look up a public invitation by its token
      description: Public. The token is the credential, so no session is required.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitation"
        "404":
          description: No such invitation
        "410":
          description: Invitation expired, revoked, or already accepted

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation and sign in
      description: >
        Two modes. Password mode (`password` present) creates a new account.
        Adopt mode (empty body, authenticated session) attaches the caller's
        existing account to the org, used when they already had a personal
        PhishAware account under the invited address.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "201":
          description: Invitation accepted; a session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "403":
          description: The organization is out of seats
        "404":
          description: No such invitation
        "409":
          description: >
            An account already exists for this address. The body's `code` is
            "account_exists": sign in, then retry with an empty body to adopt it.
        "410":
          description: Invitation expired, revoked, or already accepted

  /auth/sso/discover:
    post:
      operationId: discoverSso
      tags: [sso]
      summary: Ask whether an email domain has single sign-on configured
      description: >
        Public and deliberately domain-granular: two addresses at the same
        domain get byte-identical responses, so this cannot be used to test
        whether a particular person has an account. Everything account-specific
        happens after the IdP has authenticated the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoDiscoverInput"
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoDiscovery"
        "429":
          description: Too many requests

  /org/sso:
    get:
      operationId: getOrgSsoConnection
      tags: [sso]
      summary: Get this organization's SSO connection (secret redacted)
      responses:
        "200":
          description: SSO connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSsoConnection"
        "403":
          description: Admin access required
    put:
      operationId: upsertOrgSsoConnection
      tags: [sso]
      summary: Create or update this organization's SSO connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrgSsoConnectionInput"
      responses:
        "200":
          description: Saved connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSsoConnection"
        "400":
          description: Invalid issuer, or discovery failed
        "403":
          description: Admin access required
        "409":
          description: Another organization has already claimed one of these domains
        "503":
          description: This server has no APP_ENCRYPTION_KEY, so secrets can't be stored
    delete:
      operationId: deleteOrgSsoConnection
      tags: [sso]
      summary: Remove this organization's SSO connection
      responses:
        "204":
          description: Connection removed
        "403":
          description: Admin access required

  /org/sso/test:
    post:
      operationId: testOrgSsoConnection
      tags: [sso]
      summary: Run server-side preflight checks against the configured IdP
      description: >
        Validates discovery, issuer exact-match, endpoints, PKCE support, JWKS,
        and client credentials, with no browser round trip and no user
        interaction. Catches the common misconfigurations before anyone
        attempts a real sign-in.
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoTestResult"
        "403":
          description: Admin access required
        "404":
          description: No SSO connection configured

  /org/members/{id}/detail:
    get:
      operationId: getOrgMemberDetail
      tags: [org]
      summary: One member's performance, in enough detail to act on
      description: >
        The same derivation the member sees for themselves, so a manager and the
        person they are managing never read different numbers for the same
        history. Scoped to the caller's own organization.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberDetail"
        "403":
          description: Admin access required
        "404":
          description: Member not found

  /org/members/{id}/reset-code:
    post:
      operationId: issueMemberResetCode
      tags: [org]
      summary: Issue a one-time password reset code for a member
      description: >
        The production path for a forgotten password, since there is no mail
        delivery. An admin issues the code and passes it to the member out of
        band; the member redeems it through /auth/password-reset/confirm. Scoped
        to the caller's own organization.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: A one-time code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResetCode"
        "403":
          description: Admin access required
        "404":
          description: Member not found
        "409":
          description: That member signs in with SSO and has no password to reset

  /org/members/{id}:
    patch:
      operationId: updateOrgMember
      tags: [org]
      summary: Change a member's role or department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Updated member
        "400":
          description: Unrecognized department
        "403":
          description: Admin access required
        "404":
          description: Member not found
    delete:
      operationId: removeOrgMember
      tags: [org]
      summary: Remove a member from the organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "403":
          description: Admin access required
        "404":
          description: Member not found

  /training:
    get:
      operationId: listMyTraining
      tags: [training]
      summary: Training assigned to the current user
      description: >
        The employee's side of a training campaign. Progress is derived from
        practice attempts recorded since the assignment was created, because
        nothing writes the stored progress field.
      responses:
        "200":
          description: Assignments for the current user, soonest deadline first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyTrainingAssignment"
        "401":
          description: Not authenticated

  /org/training:
    get:
      operationId: listOrgTraining
      tags: [org]
      summary: List the organization's training campaigns
      responses:
        "200":
          description: Training campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingAssignment"
        "403":
          description: Admin access required
    post:
      operationId: createOrgTraining
      tags: [org]
      summary: Create a training campaign and assign it to members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainingInput"
      responses:
        "201":
          description: Training campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAssignment"
        "400":
          description: Invalid input
        "403":
          description: Admin access required
        "404":
          description: Target member not found

  /org/training/{id}:
    get:
      operationId: getOrgTrainingDetail
      tags: [org]
      summary: A campaign and who has completed it
      description: >
        Progress per assigned member, counted from practice attempts recorded
        since the assignment was created -- the same derivation the employee's
        own view uses, so the two cannot disagree.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The campaign with per-member progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDetail"
        "403":
          description: Admin access required
        "404":
          description: Campaign not found
    delete:
      operationId: deleteOrgTraining
      tags: [org]
      summary: Remove a training campaign and its assignments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Training campaign removed
        "403":
          description: Admin access required
        "404":
          description: Training campaign not found

  /org/analytics:
    get:
      operationId: getOrgAnalytics
      tags: [org]
      summary: Get organization-wide training analytics
      responses:
        "200":
          description: Organization analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAnalytics"
        "403":
          description: Admin access required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Everything an organisation can customise about its workspace. Every field
    # is admin-supplied and rendered to that organisation's employees, so the
    # server validates each one to the narrowest shape that still expresses what
    # it is for (see src/server/orgBranding.ts) rather than trusting the form.
    OrgWorkspace:
      type: object
      required: [orgName, branding, reporting, practiceVectors]
      properties:
        orgName:
          type: string
          nullable: true
          description: >
            The organisation's name. Exposed here because an employee needs it
            to see whose workspace they are in, and GET /api/org is
            admin-only -- so members had no way to read the name of the
            organisation they belong to.
        branding:
          $ref: "#/components/schemas/OrgBranding"
        reporting:
          $ref: "#/components/schemas/OrgReporting"
        practiceVectors:
          type: array
          description: >
            Channels this organisation trains on. Empty means all of them --
            a warehouse has no reason to drill Slack DMs.
          items:
            $ref: "#/components/schemas/Vector"

    OrgBranding:
      type: object
      required: [accentColor, logoUrl, welcomeMessage]
      properties:
        accentColor:
          type: string
          nullable: true
          pattern: "^#[0-9a-f]{6}$"
          description: >
            Exact six-digit hex. Reaches a CSS custom property, so anything
            looser could break out of the declaration.
        logoUrl:
          type: string
          nullable: true
          description: "An https image URL. Never http, data:, or javascript:."
        welcomeMessage:
          type: string
          nullable: true
          description: Plain text. Rendered escaped, never as HTML.

    OrgReporting:
      type: object
      required: [channel, instructions]
      properties:
        channel:
          type: string
          nullable: true
          description: >
            Where a real phishing email should go: an email address, or an
            https link to an internal form. Training that names the actual
            address teaches the behaviour; "tell your security team" does not.
        instructions:
          type: string
          nullable: true

    ReadinessStatus:
      type: object
      required: [ready, database]
      properties:
        ready:
          type: boolean
        database:
          type: string
          enum: [ok, unreachable]
          description: >
            Deliberately coarse. A readiness probe is unauthenticated, so it
            reports reachability and nothing about the failure.
        checkedAt:
          type: string
          format: date-time


    Level:
      type: string
      enum: [beginner, intermediate, advanced]

    Vector:
      type: string
      enum: [email, sms, voice, qr, social, web]

    Severity:
      type: string
      enum: [low, medium, high]

    CueId:
      type: string
      enum:
        - sender_domain
        - mismatched_link
        - urgency_language
        - generic_greeting
        - credential_request
        - spelling_grammar
        - unexpected_attachment
        - suspicious_qr

    CueOption:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/CueId"
        label:
          type: string

    User:
      type: object
      required:
        [
          id,
          name,
          isGuest,
          level,
          xp,
          streak,
          badges,
          calibrationScore,
          onboardingCompleted,
          createdAt,
          role,
          hasOrg,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
          description: >
            The caller's own role. Needed so the UI can hide admin-only
            navigation instead of routing members to a page whose every request
            will 403. Telling someone their own role reveals nothing.
        hasOrg:
          type: boolean
          description: >
            Whether the caller belongs to an organization. Distinguishes a
            member (no admin nav) from an unaffiliated user (offered the
            create-organization flow).
        email:
          type: ["string", "null"]
        isGuest:
          type: boolean
        level:
          $ref: "#/components/schemas/Level"
        xp:
          type: integer
        streak:
          type: integer
        badges:
          type: array
          items:
            type: string
        calibrationScore:
          type: number
        department:
          type: ["string", "null"]
        workType:
          type: ["string", "null"]
        phishingAwarenessScore:
          type: number
          description: Predicted from onboarding survey and diagnostic results; drives initial level and generated-scenario difficulty.
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuthSignupInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    PasswordResetRequestOutput:
      type: object
      required: [ok, delivery]
      properties:
        ok:
          type: boolean
        code:
          type: string
          nullable: true
          description: >
            Only ever populated outside production, where there is no mail
            delivery and showing the code in the UI is the point. In production
            this is always null and `delivery` says how to obtain one, because
            returning it over HTTP would let anyone who knows an address take
            over the account.
        delivery:
          type: string
          enum: [shown, out_of_band, administrator]
          description: >
            "shown" -- the code is in this response (never in production).
            "out_of_band" -- it was handed to the configured delivery channel
            (PASSWORD_RESET_WEBHOOK_URL). "administrator" -- no channel is
            configured or delivery failed, so an organization admin issues one;
            in that case the response is identical whether or not the address
            has an account.

    PasswordResetConfirmInput:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
        code:
          type: string
        newPassword:
          type: string
          minLength: 8

    ScenarioLink:
      type: object
      required: [text, isSuspicious]
      properties:
        text:
          type: string
        isSuspicious:
          type: boolean

    ScenarioAttachment:
      type: object
      required: [name, isSuspicious]
      properties:
        name:
          type: string
        isSuspicious:
          type: boolean

    OnboardingQuestion:
      type: object
      required: [id, vector, sender, subject, body, links]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        sender:
          type: string
        subject:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioLink"

    OnboardingAnswer:
      type: object
      required: [scenarioId, verdict]
      properties:
        scenarioId:
          type: string
        verdict:
          type: boolean
          description: true if the user judged it phishing

    SurveyFeatures:
      type: object
      description: >
        The intro survey's answers in feature form -- booleans as 1/0, "how
        often" answers as 0-100, counts as non-negative integers. Question
        wording and ordering live in src/lib/onboarding-survey.ts; this is the
        wire shape they reduce to.
      required:
        [
          emails_per_day,
          suspicious_emails_per_day,
          password_length,
          reuses_passwords,
          uses_password_manager,
          mfa_familiar,
          mfa_enabled,
          security_training,
          clicks_links,
          opens_attachments,
          verifies_links,
          reports_suspicious,
          has_antivirus,
          uses_vpn,
          department,
          work_mode,
        ]
      properties:
        emails_per_day:
          type: integer
          minimum: 0
          maximum: 1000
        suspicious_emails_per_day:
          type: integer
          minimum: 0
          maximum: 1000
        password_length:
          type: integer
          minimum: 1
          maximum: 128
        reuses_passwords:
          type: integer
          minimum: 0
          maximum: 1
        uses_password_manager:
          type: integer
          minimum: 0
          maximum: 1
        mfa_familiar:
          type: integer
          minimum: 0
          maximum: 1
        mfa_enabled:
          type: integer
          minimum: 0
          maximum: 1
          description: Always 0 when mfa_familiar is 0 -- the question isn't asked.
        security_training:
          type: integer
          minimum: 0
          maximum: 1
        clicks_links:
          type: integer
          minimum: 0
          maximum: 100
        opens_attachments:
          type: integer
          minimum: 0
          maximum: 100
        verifies_links:
          type: integer
          minimum: 0
          maximum: 100
        reports_suspicious:
          type: integer
          minimum: 0
          maximum: 100
        has_antivirus:
          type: integer
          minimum: 0
          maximum: 1
        uses_vpn:
          type: integer
          minimum: 0
          maximum: 1
        department:
          $ref: "#/components/schemas/Department"
        work_mode:
          type: string
          enum: [Remote, Hybrid, Office]

    Department:
      type: string
      description: >
        The standard department set: what the onboarding survey offers, what a
        new organization is seeded with, and the keys of DEPARTMENT_ATTACK_TYPES
        in src/server/attackProfiles.ts. It is not the only set a department name
        can come from -- organizations define their own (see /org/departments),
        and anything outside these ten falls back to the universal attack set.
        Kept in sync with DEPARTMENTS in src/lib/onboarding-survey.ts.
      enum:
        - Customer Support
        - Engineering
        - Executive
        - Finance
        - HR
        - IT
        - Legal
        - Marketing
        - Operations
        - Sales

    OnboardingSubmitInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingAnswer"
        features:
          $ref: "#/components/schemas/SurveyFeatures"

    OnboardingResult:
      type: object
      required: [level, correctCount, totalCount]
      properties:
        level:
          $ref: "#/components/schemas/Level"
        correctCount:
          type: integer
        totalCount:
          type: integer

    LessonScreen:
      description: >
        One screen of a lesson. The kinds beyond "prose" are what make a lesson
        teach rather than summarise: a worked example with callouts, genuine
        beside fake, ordered checks, and a question. Prose screens predate the
        others and may omit "kind" entirely, so the union is matched
        structurally rather than by a required discriminator.
      oneOf:
        - $ref: "#/components/schemas/LessonProseScreen"
        - $ref: "#/components/schemas/LessonAnatomyScreen"
        - $ref: "#/components/schemas/LessonAnnotatedScreen"
        - $ref: "#/components/schemas/LessonCompareScreen"
        - $ref: "#/components/schemas/LessonStepsScreen"
        - $ref: "#/components/schemas/LessonCheckpointScreen"

    LessonProseScreen:
      type: object
      required: [heading, body]
      properties:
        kind:
          type: string
          enum: [prose]
        heading:
          type: string
        body:
          type: string

    LessonAnatomyScreen:
      type: object
      required: [kind, heading, intro, sample, callouts]
      properties:
        kind:
          type: string
          enum: [anatomy]
        heading:
          type: string
        intro:
          type: string
        sample:
          type: object
          required: [displayName, address, subject, body, linkText, linkHref]
          properties:
            displayName:
              type: string
            address:
              type: string
            subject:
              type: string
            body:
              type: string
            linkText:
              type: string
            linkHref:
              type: string
        callouts:
          type: array
          items:
            type: object
            required: [target, detail]
            properties:
              target:
                type: string
                enum: [displayName, address, subject, body, link]
              detail:
                type: string

    LessonAnnotatedScreen:
      type: object
      required: [kind, heading, intro, frame, parts, callouts]
      properties:
        kind:
          type: string
          enum: [annotated]
        heading:
          type: string
        intro:
          type: string
        frame:
          type: string
        parts:
          type: array
          items:
            type: object
            required: [id, value]
            properties:
              id:
                type: string
              label:
                type: string
              value:
                type: string
              mono:
                type: boolean
        callouts:
          type: array
          items:
            type: object
            required: [target, label, detail]
            properties:
              target:
                type: string
              label:
                type: string
              detail:
                type: string

    LessonCompareScreen:
      type: object
      required: [kind, heading, intro, rows]
      properties:
        kind:
          type: string
          enum: [compare]
        heading:
          type: string
        intro:
          type: string
        rows:
          type: array
          items:
            type: object
            required: [label, genuine, fake, note]
            properties:
              label:
                type: string
              genuine:
                type: string
              fake:
                type: string
              note:
                type: string

    LessonStepsScreen:
      type: object
      required: [kind, heading, intro, steps]
      properties:
        kind:
          type: string
          enum: [steps]
        heading:
          type: string
        intro:
          type: string
        steps:
          type: array
          items:
            type: object
            required: [action, lookFor, warningSign]
            properties:
              action:
                type: string
              lookFor:
                type: string
              warningSign:
                type: string

    LessonCheckpointScreen:
      type: object
      required: [kind, heading, prompt, options]
      properties:
        kind:
          type: string
          enum: [checkpoint]
        heading:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: object
            required: [label, correct, feedback]
            properties:
              label:
                type: string
              correct:
                type: boolean
              feedback:
                type: string

    LessonSummary:
      type: object
      required: [id, vector, title, summary, completed]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        title:
          type: string
        summary:
          type: string
        completed:
          type: boolean
          description: >
            Whether this learner has finished it. Lessons used to be a library
            that recorded nothing, so a campaign could assign reading that had
            no way of being completed.

    Lesson:
      type: object
      required: [id, vector, title, summary, screens, redFlags]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        title:
          type: string
        summary:
          type: string
        screens:
          type: array
          items:
            $ref: "#/components/schemas/LessonScreen"
        redFlags:
          type: array
          items:
            type: string

    PracticeScenario:
      type: object
      required: [id, vector, sender, subject, body, links, attachments, difficulty]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        sender:
          type: string
        subject:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioLink"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAttachment"
        difficulty:
          type: integer
          minimum: 1
          maximum: 5

    ChatbotMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    ChatbotRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChatbotMessage"

    ChatbotResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string

    SubmitAttemptInput:
      type: object
      required: [scenarioId, verdict, selectedCues, confidence]
      properties:
        scenarioId:
          type: string
        verdict:
          type: boolean
          description: true if the user judged it phishing
        selectedCues:
          type: array
          # Bounded at the contract. Without maxItems a crafted POST could send
          # an array of millions of repeated cues: grading de-duplicates so the
          # score stays correct, but the attempt document would still grow
          # without limit. There are only 8 cue types, so no honest client can
          # exceed that.
          uniqueItems: true
          maxItems: 8
          items:
            $ref: "#/components/schemas/CueId"
        confidence:
          type: integer
          minimum: 0
          maximum: 100

    AttemptResult:
      type: object
      required:
        - correct
        - correctVerdict
        - missedCues
        - falseCues
        - caughtCues
        - explanation
        - calibrationNote
        - xpAwarded
        - totalXp
        - level
        - leveledUp
        - streak
        - badgesEarned
      properties:
        correct:
          type: boolean
          description: Whether this learner's verdict was right.
        correctVerdict:
          type: boolean
          description: >
            What the answer actually was -- true for phishing, false for
            legitimate. Previously this was assigned the same value as
            `correct`, so a field named "the correct verdict" in fact held
            "was the verdict correct".
        caughtCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        missedCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        falseCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        explanation:
          type: string
        calibrationNote:
          type: string
        xpAwarded:
          type: integer
        totalXp:
          type: integer
        level:
          $ref: "#/components/schemas/Level"
        leveledUp:
          type: boolean
        streak:
          type: integer
        badgesEarned:
          type: array
          items:
            type: string

    DashboardSummary:
      type: object
      required:
        - name
        - level
        - xp
        - xpToNextLevel
        - xpIntoLevel
        - streak
        - strengths
        - focusAreas
        - badges
        - totalAttempts
        - accuracyRate
        - retention
      properties:
        name:
          type: string
        level:
          $ref: "#/components/schemas/Level"
        xp:
          type: integer
        xpToNextLevel:
          type: integer
        xpIntoLevel:
          type: integer
        streak:
          type: integer
        strengths:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyPerformanceArea"
        focusAreas:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyPerformanceArea"
        badges:
          type: array
          items:
            type: string
        totalAttempts:
          type: integer
        accuracyRate:
          type: number
        retention:
          $ref: "#/components/schemas/RetentionSummary"

    # What the learner's spaced-review schedule currently says. Lifetime accuracy
    # stops moving after a few dozen attempts and so stops being feedback; this
    # changes every session, which is what makes it worth coming back to.
    RetentionSummary:
      type: object
      required: [mastered, due, tracked, masteryStreak, masteredTargets, dueTargets, targets]
      properties:
        mastered:
          type: integer
          description: Targets on a run of correct answers.
        due:
          type: integer
          description: Targets owed practice right now.
        tracked:
          type: integer
        masteryStreak:
          type: integer
          description: Consecutive successes mastery requires.
        nextDueAt:
          type: string
          format: date-time
          nullable: true
          description: When the next target comes back up, if nothing is due now.
        masteredTargets:
          type: array
          items:
            type: string
        dueTargets:
          type: array
          items:
            type: string
        targets:
          type: array
          description: >
            Every tracked target with its streak, strongest first. Counts alone
            made the feature look inert: mastery takes three correct answers in
            a row and reviews are scheduled a day out, so a learner who had just
            practised saw "0 mastered, nothing due" and concluded nothing was
            happening.
          items:
            $ref: "#/components/schemas/RetentionTarget"

    RetentionTarget:
      type: object
      required: [label, targetType, streak, mastered, due]
      properties:
        label:
          type: string
        targetType:
          type: string
          enum: [cueType, emotionalLever, vector]
        streak:
          type: integer
        mastered:
          type: boolean
        due:
          type: boolean

    TaxonomyPerformanceArea:
      type: object
      required: [id, category, label, attempts, accuracyRate]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [attack_type, persuasion_tactic]
        label:
          type: string
        attempts:
          type: integer
        accuracyRate:
          type: number

    CueAccuracy:
      type: object
      required: [cueId, label, attempts, rate]
      properties:
        cueId:
          $ref: "#/components/schemas/CueId"
        label:
          type: string
        attempts:
          type: integer
        rate:
          type: number

    VectorAccuracy:
      type: object
      required: [vector, attempts, rate]
      properties:
        vector:
          $ref: "#/components/schemas/Vector"
        attempts:
          type: integer
        rate:
          type: number

    ProgressPoint:
      type: object
      required: [date, accuracyRate, attempts]
      properties:
        date:
          type: string
          format: date
        accuracyRate:
          type: number
        attempts:
          type: integer

    AnalyticsSummary:
      type: object
      required:
        [cueAccuracy, vectorAccuracy, calibrationScore, progressOverTime, totalAttempts]
      properties:
        cueAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/CueAccuracy"
        vectorAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/VectorAccuracy"
        calibrationScore:
          type: number
        progressOverTime:
          type: array
          items:
            $ref: "#/components/schemas/ProgressPoint"
        totalAttempts:
          type: integer

    LeaderboardScope:
      type: string
      enum: [department, organization]

    LeaderboardEntry:
      type: object
      required: [rank, name, xp, level, isCurrentUser]
      properties:
        rank:
          type: integer
        name:
          type: string
        xp:
          type: integer
        level:
          $ref: "#/components/schemas/Level"
        isCurrentUser:
          type: boolean

    OrgRole:
      type: string
      enum: [admin, employee]

    RiskLevel:
      type: string
      enum: [low, medium, high]

    SeatUsage:
      type: object
      required: [activeSeats, pendingInvitations, seatLimit]
      properties:
        activeSeats:
          type: integer
        pendingInvitations:
          type: integer
        seatLimit:
          type: integer
          description: 0 means unlimited

    TrainingDetail:
      type: object
      required: [id, title, target, dueDate, requiredScenarios, members, focusLabel]
      properties:
        id:
          type: string
        title:
          type: string
        target:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
        requiredScenarios:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/TrainingMemberProgress"
        focusLabel:
          type: string
        focus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CampaignFocus"

    TrainingMemberProgress:
      type: object
      required: [id, name, completedScenarios, status]
      properties:
        id:
          type: string
        name:
          type: string
        department:
          type: ["string", "null"]
        completedScenarios:
          type: integer
        status:
          type: string
          enum: [assigned, in_progress, completed, overdue]

    Org:
      type: object
      required: [id, name, ssoDomain, seatLimit, ssoEnabled, ssoProvider, seats]
      properties:
        id:
          type: string
        name:
          type: string
        ssoDomain:
          type: string
          description: >
            The organization's primary email domain, for display. It does NOT
            grant access on its own; membership is invite-only. Domains that
            actually gate SSO live on the SSO connection's allowedDomains.
        seatLimit:
          type: integer
          description: 0 means unlimited
        ssoEnabled:
          type: boolean
          description: Mirrored from the org's SSO connection so this needs no extra read
        ssoProvider:
          type: ["string", "null"]
        seats:
          allOf:
            - $ref: "#/components/schemas/SeatUsage"
          description: >
            Current usage, so an admin sees how close they are to the limit
            instead of discovering it when an invitation is refused. Counts
            pending invitations, which hold a seat too.
        workspace:
          allOf:
            - $ref: "#/components/schemas/OrgWorkspace"
          nullable: true
          description: >
            The organisation's own customisation, so the admin form can seed
            its fields from the same source employees read.


    CreateOrgInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ssoDomain:
          type: string

    UpdateOrgSettingsInput:
      type: object
      properties:
        name:
          type: string
        ssoDomain:
          type: string
          description: Display only. See Org.ssoDomain; this does not grant access.
        seatLimit:
          type: integer
          description: 0 means unlimited
        # Every field below is rendered to this organisation's employees, so the
        # server validates each one and rejects rather than coerces. An empty
        # string clears a field; omitting it leaves it alone.
        branding:
          type: object
          properties:
            accentColor:
              type: string
              description: Six-digit hex, or empty to clear.
            logoUrl:
              type: string
              description: An https URL, or empty to clear.
            welcomeMessage:
              type: string
        reporting:
          type: object
          properties:
            channel:
              type: string
              description: An email address or an https link, or empty to clear.
            instructions:
              type: string
        practiceVectors:
          type: array
          description: Channels to train on. Every channel selected is stored as no restriction.
          items:
            $ref: "#/components/schemas/Vector"

    OrgMember:
      type: object
      required:
        [
          id,
          kind,
          name,
          email,
          role,
          department,
          status,
          joinedAt,
          expiresAt,
          accuracy,
          riskLevel,
        ]
      properties:
        id:
          type: string
          description: >
            A user id when kind="member", an invitation id when
            kind="invitation". The two are not interchangeable.
        kind:
          type: string
          enum: [member, invitation]
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/OrgRole"
        department:
          type: ["string", "null"]
          description: >
            For a member, what they reported on the intro survey. For an
            invitation, what the admin pinned to it (null if they left it open).
        status:
          type: string
          enum: [invited, active, disabled]
        joinedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: When an invitation lapses. Always null for kind="member".
        accuracy:
          type: integer
          description: 0-100, computed from real practice attempts
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"

    InviteMemberInput:
      type: object
      required: [email]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        department:
          type: string
          description: >
            Optional. When set, the invited user is created with this
            department and the intro survey stops asking for it.

    InviteMemberResult:
      type: object
      required: [member, inviteUrl]
      properties:
        member:
          $ref: "#/components/schemas/OrgMember"
        inviteUrl:
          type: string
          description: >
            The accept link. Returned only here and from
            /org/invitations/{id}/link, never in the members list.

    InvitationLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: ["string", "null"]
          format: date-time

    PublicInvitation:
      type: object
      required:
        [orgName, email, role, department, expiresAt, ssoAvailable, requiresExistingAccount]
      properties:
        orgName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        department:
          type: ["string", "null"]
          description: >
            Pinned by the inviting admin. Carried onto the account on accept,
            which is what lets the intro survey skip the question.
        expiresAt:
          type: ["string", "null"]
          format: date-time
        ssoAvailable:
          type: boolean
        ssoStartUrl:
          type: ["string", "null"]
        requiresExistingAccount:
          type: boolean
          description: >
            True when a PhishAware account already uses this address. The
            password form is replaced by a sign-in-to-accept prompt, so an
            invitation can never silently absorb someone else's account.

    AcceptInvitationInput:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
          description: Omit entirely to adopt the currently signed-in account instead.

    MemberResetCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time

    OrgMemberDetail:
      type: object
      required:
        [
          id,
          name,
          email,
          role,
          status,
          department,
          accuracy,
          risk,
          calibrationScore,
          totalAttempts,
          cueAccuracy,
          vectorAccuracy,
          assignments,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/OrgRole"
        status:
          type: string
        department:
          type: ["string", "null"]
        joinedAt:
          type: ["string", "null"]
          format: date-time
        lastActiveAt:
          type: ["string", "null"]
          format: date-time
        accuracy:
          type: integer
        risk:
          type: string
          enum: [low, medium, high]
        calibrationScore:
          type: integer
          description: >
            Confidence weighted by whether it was warranted. Somebody
            confidently wrong is the most dangerous learner in the building, and
            a bare accuracy figure hides them.
        totalAttempts:
          type: integer
        cueAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/MemberCueAccuracy"
        vectorAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/MemberVectorAccuracy"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/MemberAssignmentSummary"

    MemberCueAccuracy:
      type: object
      required: [cueId, label, attempts, rate]
      properties:
        cueId:
          type: string
        label:
          type: string
        attempts:
          type: integer
        rate:
          type: integer

    MemberVectorAccuracy:
      type: object
      required: [vector, attempts, rate]
      properties:
        vector:
          $ref: "#/components/schemas/Vector"
        attempts:
          type: integer
        rate:
          type: integer

    MemberAssignmentSummary:
      type: object
      required: [id, title, requiredScenarios, completedScenarios, status]
      properties:
        id:
          type: string
        title:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
        requiredScenarios:
          type: integer
        completedScenarios:
          type: integer
        status:
          type: string
          enum: [assigned, in_progress, completed, overdue]

    MarkNotificationsReadInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string

    NotificationsMarkedResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    ConsentStatus:
      type: object
      required: [policyVersion, policies]
      properties:
        policyVersion:
          type: string
          description: >
            Consent to one wording is not consent to a later one, so a decision
            recorded against an older version does not count as a decision.
        policies:
          type: array
          items:
            $ref: "#/components/schemas/ConsentPolicyState"

    ConsentPolicyState:
      type: object
      required: [policy, title, body, optional, granted, needsDecision]
      properties:
        policy:
          type: string
          enum: [data_processing, emotional_profiling]
        title:
          type: string
        body:
          type: string
        optional:
          type: boolean
          description: False means the product cannot function without it.
        granted:
          type: boolean
        needsDecision:
          type: boolean
        decidedAt:
          type: ["string", "null"]
          format: date-time

    ConsentDecisionInput:
      type: object
      required: [policy, granted]
      properties:
        policy:
          type: string
          enum: [data_processing, emotional_profiling]
        granted:
          type: boolean

    Notification:
      type: object
      required: [id, type, title, body, read, at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [assignment, reminder, result, system, survey]
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        at:
          type: string
          format: date-time

    AuditEntry:
      type: object
      required: [id, action, actor, targetType, at]
      properties:
        id:
          type: string
        action:
          type: string
        actor:
          type: string
          description: The admin who did it, or "Former member" if their account is gone.
        targetType:
          type: string
        targetId:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time

    OrgDepartment:
      type: object
      required: [id, name, memberCount]
      properties:
        id:
          type: string
        name:
          type: string
        memberCount:
          type: integer

    OrgDepartmentSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateMemberRoleInput:
      type: object
      description: >
        Both fields are optional so an admin can change a role, a department, or
        both. Omitting a field leaves it as it is; sending department: null
        unassigns the member.
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
        department:
          type: ["string", "null"]
          description: An organization-defined department name.

    MyTrainingAssignment:
      type: object
      required:
        [id, title, dueDate, requiredScenarios, completedScenarios, status, focusLabel]
      properties:
        id:
          type: string
        title:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
        requiredScenarios:
          type: integer
        completedScenarios:
          type: integer
          description: >
            Practice attempts recorded since this assignment was created, capped
            at requiredScenarios.
        status:
          type: string
          enum: [assigned, in_progress, completed, overdue]
        focusLabel:
          type: string
          description: The requirement in words, shared with the admin view.
        completedLessons:
          type: integer
          description: How many of the campaign's assigned lessons this member has read.
        requiredLessons:
          type: integer
          description: >
            How many lessons the campaign assigns. Campaigns could always name
            lessonIds, but progress counted scenarios only, so a reading
            assignment could never reach completion.


    TrainingAssignment:
      type: object
      required: [id, title, target, dueDate, requiredScenarios, createdAt, focus]
      properties:
        id:
          type: string
        title:
          type: string
        target:
          type: string
          description: >
            "all", "department:<Name>" for one department (see the Department
            enum), or a specific member's user id.
        dueDate:
          type: ["string", "null"]
          format: date
        requiredScenarios:
          type: integer
        createdAt:
          type: string
          format: date-time
        focus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CampaignFocus"

    CampaignFocus:
      type: object
      required: [vectors, minDifficulty, cues]
      description: >
        What a campaign trains. Only qualifying practice counts toward the
        requirement, and the practice engine steers assigned members toward the
        same material -- so "five scenarios on lookalike domains at level 4" is a
        campaign rather than a note in the title.
      properties:
        vectors:
          type: array
          description: Vectors that count. Empty means every vector.
          items:
            $ref: "#/components/schemas/Vector"
        minDifficulty:
          type: integer
          minimum: 1
          maximum: 5
        cues:
          type: array
          description: A scenario counts if it carries at least one of these.
          items:
            type: string

    CreateTrainingInput:
      type: object
      required: [title, target, dueDate]
      properties:
        title:
          type: string
        target:
          type: string
          description: >
            "all", "department:<Name>" for one department (see the Department
            enum), or a specific member's user id.
        dueDate:
          type: string
          format: date
        requiredScenarios:
          type: integer
        focus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CampaignFocus"

    OrgMemberAccuracy:
      type: object
      required: [name, accuracy, risk]
      properties:
        name:
          type: string
        accuracy:
          type: integer
        risk:
          $ref: "#/components/schemas/RiskLevel"

    OrgAnalytics:
      type: object
      required:
        [
          avgAccuracy,
          activeCount,
          atRisk,
          riskBands,
          participationRate,
          perMember,
          perDepartment,
        ]
      properties:
        avgAccuracy:
          type: integer
        activeCount:
          type: integer
        atRisk:
          type: integer
        riskBands:
          type: object
          required: [low, medium, high]
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
        participationRate:
          type: integer
          description: "% of active members with at least one practice attempt"
        perMember:
          type: array
          items:
            $ref: "#/components/schemas/OrgMemberAccuracy"
        perDepartment:
          type: array
          description: >
            Active members grouped by their assigned department, worst average
            accuracy first. Members with no department are grouped under a null
            department rather than dropped, so the counts still add up.
          items:
            $ref: "#/components/schemas/OrgDepartmentAccuracy"

    OrgDepartmentAccuracy:
      type: object
      required: [department, memberCount, avgAccuracy, atRisk]
      properties:
        department:
          type: ["string", "null"]
          description: An organization-defined department name.
        memberCount:
          type: integer
        avgAccuracy:
          type: integer
        atRisk:
          type: integer
        seats:
          allOf:
            - $ref: "#/components/schemas/SeatUsage"
          description: >
            Current usage, so an admin sees how close they are to the limit
            instead of discovering it when an invitation is refused.

    SsoProviderKind:
      type: string
      enum: [okta, entra, google, auth0, generic]

    SsoDiscoverInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SsoDiscovery:
      type: object
      required: [ssoAvailable]
      properties:
        ssoAvailable:
          type: boolean
        orgName:
          type: ["string", "null"]
        providerKind:
          type: ["string", "null"]
        startUrl:
          type: ["string", "null"]
          description: Navigate to this with window.location.href; do not fetch it.

    OrgSsoConnection:
      type: object
      required:
        [configured, serverConfigured, redirectUri, enabled, issuer, clientId,
         hasClientSecret, providerKind, allowedDomains, requireVerifiedEmail,
         lastTestAt, lastTestOk, lastTestError]
      properties:
        configured:
          type: boolean
          description: False when this org has no SSO connection saved yet.
        serverConfigured:
          type: boolean
          description: >
            False when the server has no APP_ENCRYPTION_KEY. SSO cannot be
            configured at all until an operator sets one.
        redirectUri:
          type: string
          description: Paste this into the IdP's allowed redirect URLs, exactly.
        enabled:
          type: boolean
        issuer:
          type: string
        clientId:
          type: string
        hasClientSecret:
          type: boolean
          description: The secret itself is never returned.
        providerKind:
          $ref: "#/components/schemas/SsoProviderKind"
        allowedDomains:
          type: array
          items:
            type: string
        requireVerifiedEmail:
          type: boolean
        lastTestAt:
          type: ["string", "null"]
          format: date-time
        lastTestOk:
          type: ["boolean", "null"]
        lastTestError:
          type: ["string", "null"]

    UpsertOrgSsoConnectionInput:
      type: object
      required: [issuer, clientId, providerKind, allowedDomains]
      properties:
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          description: Omit to keep the stored secret unchanged.
        providerKind:
          $ref: "#/components/schemas/SsoProviderKind"
        allowedDomains:
          type: array
          items:
            type: string
        requireVerifiedEmail:
          type: boolean
        enabled:
          type: boolean

    SsoTestCheck:
      type: object
      required: [id, label, status, detail]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pass, warn, fail]
        detail:
          type: string

    SsoTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SsoTestCheck"
