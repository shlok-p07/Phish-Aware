openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PhishAware API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: onboarding
    description: Onboarding diagnostic quiz
  - name: lessons
    description: Learn library
  - name: practice
    description: Practice loop
  - name: dashboard
    description: Dashboard summary
  - name: profile
    description: Analytics / susceptibility profile
  - name: leaderboard
    description: Leaderboard
  - name: org
    description: Organization admin (members, training campaigns, analytics)
  - name: invitations
    description: Org invitations — issuing them (admin) and accepting them (public)
  - name: sso
    description: Per-organization OIDC single sign-on
paths:
  # NOTE — Browser-navigation endpoints deliberately absent from this spec:
  #   GET /auth/sso/start     302 -> the org's identity provider
  #   GET /auth/sso/callback  302 -> /dashboard or /auth?sso_error=<code>
  # Both are top-level browser navigations, not fetches. Generating react-query
  # hooks for them would produce clients that fetch() the URL, transparently
  # follow the redirect to a cross-origin IdP, and fail with an opaque CORS
  # error. The UI navigates to them with window.location.href instead.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input or email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/guest:
    post:
      operationId: continueAsGuest
      tags: [auth]
      summary: Start a guest session
      responses:
        "201":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and clear the session
      responses:
        "204":
          description: Logged out

  /onboarding/quiz:
    get:
      operationId: getOnboardingQuiz
      tags: [onboarding]
      summary: Get the 5-question onboarding diagnostic quiz
      responses:
        "200":
          description: Onboarding quiz questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingQuestion"

  /onboarding/submit:
    post:
      operationId: submitOnboardingQuiz
      tags: [onboarding]
      summary: Submit onboarding quiz answers and receive a starting level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingSubmitInput"
      responses:
        "200":
          description: Onboarding result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResult"

  /lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List all lessons in the learn library
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonSummary"

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a single lesson with its screens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Lesson not found

  /practice/cue-options:
    get:
      operationId: listCueOptions
      tags: [practice]
      summary: List the canonical set of selectable red-flag cues
      responses:
        "200":
          description: Cue options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CueOption"

  /practice/next:
    get:
      operationId: getNextPracticeScenario
      tags: [practice]
      summary: Get the next recommended practice scenario for the current user
      responses:
        "200":
          description: Next practice scenario (answer withheld)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeScenario"
        "401":
          description: Not authenticated

  /practice/attempts:
    post:
      operationId: submitAttempt
      tags: [practice]
      summary: Submit a verdict, selected cues, and confidence for a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAttemptInput"
      responses:
        "200":
          description: Graded attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "401":
          description: Not authenticated
        "404":
          description: Scenario not found

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current user's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated

  /profile/analytics:
    get:
      operationId: getAnalytics
      tags: [profile]
      summary: Get the current user's susceptibility profile / analytics
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          description: Not authenticated

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get the XP leaderboard (seeded sample users + current user)
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /org:
    get:
      operationId: getOrg
      tags: [org]
      summary: Get the current user's organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          description: Not authenticated
        "404":
          description: The current user doesn't belong to an organization yet
    post:
      operationId: createOrg
      tags: [org]
      summary: Create an organization and become its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          description: Not authenticated
        "409":
          description: The current user already belongs to an organization
    delete:
      operationId: deleteOrg
      tags: [org]
      summary: Delete the organization (unassigns members, removes training data)
      responses:
        "204":
          description: Organization deleted
        "403":
          description: Admin access required

  /org/settings:
    patch:
      operationId: updateOrgSettings
      tags: [org]
      summary: Update organization name, SSO domain, or seat limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgSettingsInput"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "403":
          description: Admin access required

  /org/members:
    get:
      operationId: listOrgMembers
      tags: [org]
      summary: List members and pending invitations, with real accuracy/risk stats
      description: >
        A merged list. Rows with kind="member" are user accounts; rows with
        kind="invitation" are outstanding invitations that nobody has accepted
        yet. Their `id` fields come from different collections, so callers must
        branch on `kind` before calling any per-row endpoint.
      responses:
        "200":
          description: Members and pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "403":
          description: Admin access required
    post:
      operationId: inviteOrgMember
      tags: [org]
      summary: Invite a member (creates a pending invitation and returns its link)
      description: >
        Creates an invitation, not a user account. The response carries the
        accept link exactly once, at the moment the admin needs to copy it —
        the members list deliberately omits it. Use /org/invitations/{id}/link
        to retrieve it again later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteMemberResult"
        "403":
          description: Admin access required, or the organization is out of seats
        "409":
          description: Already a member, or already has a pending invitation

  /org/invitations/{id}:
    delete:
      operationId: revokeOrgInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation revoked
        "403":
          description: Admin access required
        "404":
          description: Invitation not found

  /org/invitations/{id}/link:
    post:
      operationId: getOrgInvitationLink
      tags: [invitations]
      summary: Retrieve an existing invitation's accept link
      description: >
        POST rather than GET so react-query won't cache a bearer token in the
        client. The token is unchanged — use /resend to rotate it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
        "403":
          description: Admin access required
        "404":
          description: Invitation not found
        "410":
          description: Invitation is no longer pending

  /org/invitations/{id}/resend:
    post:
      operationId: resendOrgInvitation
      tags: [invitations]
      summary: Rotate an invitation's token and extend its expiry
      description: >
        Issues a brand-new token, invalidating the previous link. This is the
        "I think that link leaked" action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
        "403":
          description: Admin access required
        "404":
          description: Invitation not found
        "410":
          description: Invitation is no longer pending

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Look up a public invitation by its token
      description: Public — the token is the credential. No session required.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitation"
        "404":
          description: No such invitation
        "410":
          description: Invitation expired, revoked, or already accepted

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation and sign in
      description: >
        Two modes. Password mode (`password` present) creates a new account.
        Adopt mode (empty body, authenticated session) attaches the caller's
        existing account to the org — used when they already had a personal
        PhishAware account under the invited address.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "201":
          description: Invitation accepted; a session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "403":
          description: The organization is out of seats
        "404":
          description: No such invitation
        "409":
          description: >
            An account already exists for this address. The body's `code` is
            "account_exists" — sign in, then retry with an empty body to adopt it.
        "410":
          description: Invitation expired, revoked, or already accepted

  /auth/sso/discover:
    post:
      operationId: discoverSso
      tags: [sso]
      summary: Ask whether an email domain has single sign-on configured
      description: >
        Public and deliberately domain-granular: two addresses at the same
        domain get byte-identical responses, so this cannot be used to test
        whether a particular person has an account. Everything account-specific
        happens after the IdP has authenticated the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoDiscoverInput"
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoDiscovery"
        "429":
          description: Too many requests

  /org/sso:
    get:
      operationId: getOrgSsoConnection
      tags: [sso]
      summary: Get this organization's SSO connection (secret redacted)
      responses:
        "200":
          description: SSO connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSsoConnection"
        "403":
          description: Admin access required
    put:
      operationId: upsertOrgSsoConnection
      tags: [sso]
      summary: Create or update this organization's SSO connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrgSsoConnectionInput"
      responses:
        "200":
          description: Saved connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSsoConnection"
        "400":
          description: Invalid issuer, or discovery failed
        "403":
          description: Admin access required
        "409":
          description: Another organization has already claimed one of these domains
        "503":
          description: This server has no APP_ENCRYPTION_KEY, so secrets can't be stored
    delete:
      operationId: deleteOrgSsoConnection
      tags: [sso]
      summary: Remove this organization's SSO connection
      responses:
        "204":
          description: Connection removed
        "403":
          description: Admin access required

  /org/sso/test:
    post:
      operationId: testOrgSsoConnection
      tags: [sso]
      summary: Run server-side preflight checks against the configured IdP
      description: >
        Validates discovery, issuer exact-match, endpoints, PKCE support, JWKS,
        and client credentials — with no browser round trip and no user
        interaction. Catches the common misconfigurations before anyone
        attempts a real sign-in.
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoTestResult"
        "403":
          description: Admin access required
        "404":
          description: No SSO connection configured

  /org/members/{id}:
    patch:
      operationId: updateOrgMemberRole
      tags: [org]
      summary: Change a member's role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Updated member role
        "403":
          description: Admin access required
        "404":
          description: Member not found
    delete:
      operationId: removeOrgMember
      tags: [org]
      summary: Remove a member from the organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "403":
          description: Admin access required
        "404":
          description: Member not found

  /org/training:
    get:
      operationId: listOrgTraining
      tags: [org]
      summary: List the organization's training campaigns
      responses:
        "200":
          description: Training campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingAssignment"
        "403":
          description: Admin access required
    post:
      operationId: createOrgTraining
      tags: [org]
      summary: Create a training campaign and assign it to members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainingInput"
      responses:
        "201":
          description: Training campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAssignment"
        "400":
          description: Invalid input
        "403":
          description: Admin access required
        "404":
          description: Target member not found

  /org/training/{id}:
    delete:
      operationId: deleteOrgTraining
      tags: [org]
      summary: Remove a training campaign and its assignments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Training campaign removed
        "403":
          description: Admin access required
        "404":
          description: Training campaign not found

  /org/analytics:
    get:
      operationId: getOrgAnalytics
      tags: [org]
      summary: Get organization-wide training analytics
      responses:
        "200":
          description: Organization analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAnalytics"
        "403":
          description: Admin access required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Level:
      type: string
      enum: [beginner, intermediate, advanced]

    Vector:
      type: string
      enum: [email, sms, voice, qr, social, web]

    Severity:
      type: string
      enum: [low, medium, high]

    CueId:
      type: string
      enum:
        - sender_domain
        - mismatched_link
        - urgency_language
        - generic_greeting
        - credential_request
        - spelling_grammar
        - unexpected_attachment
        - suspicious_qr

    CueOption:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/CueId"
        label:
          type: string

    User:
      type: object
      required:
        [
          id,
          name,
          isGuest,
          level,
          xp,
          streak,
          badges,
          calibrationScore,
          onboardingCompleted,
          createdAt,
          role,
          hasOrg,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
          description: >
            The caller's own role. Needed so the UI can hide admin-only
            navigation instead of routing members to a page whose every request
            will 403. Telling someone their own role reveals nothing.
        hasOrg:
          type: boolean
          description: >
            Whether the caller belongs to an organization. Distinguishes a
            member (no admin nav) from an unaffiliated user (offered the
            create-organization flow).
        email:
          type: ["string", "null"]
        isGuest:
          type: boolean
        level:
          $ref: "#/components/schemas/Level"
        xp:
          type: integer
        streak:
          type: integer
        badges:
          type: array
          items:
            type: string
        calibrationScore:
          type: number
        department:
          type: ["string", "null"]
        workType:
          type: ["string", "null"]
        ageRange:
          type: ["string", "null"]
        phishingAwarenessScore:
          type: number
          description: Derived from onboarding diagnostic accuracy; drives generated-scenario difficulty.
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuthSignupInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ScenarioLink:
      type: object
      required: [text, isSuspicious]
      properties:
        text:
          type: string
        isSuspicious:
          type: boolean

    ScenarioAttachment:
      type: object
      required: [name, isSuspicious]
      properties:
        name:
          type: string
        isSuspicious:
          type: boolean

    OnboardingQuestion:
      type: object
      required: [id, vector, sender, subject, body, links]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        sender:
          type: string
        subject:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioLink"

    OnboardingAnswer:
      type: object
      required: [scenarioId, verdict]
      properties:
        scenarioId:
          type: string
        verdict:
          type: boolean
          description: true if the user judged it phishing

    OnboardingSubmitInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingAnswer"
        department:
          type: string
          description: From the intro survey -- used to tailor generated scenarios.
        workType:
          type: string
          description: From the intro survey (e.g. Remote/Hybrid/Onsite).
        ageRange:
          type: string
          description: From the intro survey, e.g. "25-34".

    OnboardingResult:
      type: object
      required: [level, correctCount, totalCount]
      properties:
        level:
          $ref: "#/components/schemas/Level"
        correctCount:
          type: integer
        totalCount:
          type: integer

    LessonScreen:
      type: object
      required: [heading, body]
      properties:
        heading:
          type: string
        body:
          type: string

    LessonSummary:
      type: object
      required: [id, vector, title, summary]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        title:
          type: string
        summary:
          type: string

    Lesson:
      type: object
      required: [id, vector, title, summary, screens, redFlags]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        title:
          type: string
        summary:
          type: string
        screens:
          type: array
          items:
            $ref: "#/components/schemas/LessonScreen"
        redFlags:
          type: array
          items:
            type: string

    PracticeScenario:
      type: object
      required: [id, vector, sender, subject, body, links, attachments, difficulty]
      properties:
        id:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        sender:
          type: string
        subject:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioLink"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioAttachment"
        difficulty:
          type: integer
          minimum: 1
          maximum: 5

    SubmitAttemptInput:
      type: object
      required: [scenarioId, verdict, selectedCues, confidence]
      properties:
        scenarioId:
          type: string
        verdict:
          type: boolean
          description: true if the user judged it phishing
        selectedCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        confidence:
          type: integer
          minimum: 0
          maximum: 100

    AttemptResult:
      type: object
      required:
        - correct
        - correctVerdict
        - missedCues
        - falseCues
        - caughtCues
        - explanation
        - calibrationNote
        - xpAwarded
        - totalXp
        - level
        - leveledUp
        - streak
        - badgesEarned
      properties:
        correct:
          type: boolean
        correctVerdict:
          type: boolean
        caughtCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        missedCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        falseCues:
          type: array
          items:
            $ref: "#/components/schemas/CueId"
        explanation:
          type: string
        calibrationNote:
          type: string
        xpAwarded:
          type: integer
        totalXp:
          type: integer
        level:
          $ref: "#/components/schemas/Level"
        leveledUp:
          type: boolean
        streak:
          type: integer
        badgesEarned:
          type: array
          items:
            type: string

    DashboardSummary:
      type: object
      required:
        - name
        - level
        - xp
        - xpToNextLevel
        - xpIntoLevel
        - streak
        - strongCues
        - weakCues
        - badges
        - totalAttempts
        - accuracyRate
      properties:
        name:
          type: string
        level:
          $ref: "#/components/schemas/Level"
        xp:
          type: integer
        xpToNextLevel:
          type: integer
        xpIntoLevel:
          type: integer
        streak:
          type: integer
        strongCues:
          type: array
          items:
            $ref: "#/components/schemas/CueOption"
        weakCues:
          type: array
          items:
            $ref: "#/components/schemas/CueOption"
        badges:
          type: array
          items:
            type: string
        totalAttempts:
          type: integer
        accuracyRate:
          type: number

    CueAccuracy:
      type: object
      required: [cueId, label, attempts, rate]
      properties:
        cueId:
          $ref: "#/components/schemas/CueId"
        label:
          type: string
        attempts:
          type: integer
        rate:
          type: number

    VectorAccuracy:
      type: object
      required: [vector, attempts, rate]
      properties:
        vector:
          $ref: "#/components/schemas/Vector"
        attempts:
          type: integer
        rate:
          type: number

    ProgressPoint:
      type: object
      required: [date, accuracyRate, attempts]
      properties:
        date:
          type: string
          format: date
        accuracyRate:
          type: number
        attempts:
          type: integer

    AnalyticsSummary:
      type: object
      required:
        [cueAccuracy, vectorAccuracy, calibrationScore, progressOverTime, totalAttempts]
      properties:
        cueAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/CueAccuracy"
        vectorAccuracy:
          type: array
          items:
            $ref: "#/components/schemas/VectorAccuracy"
        calibrationScore:
          type: number
        progressOverTime:
          type: array
          items:
            $ref: "#/components/schemas/ProgressPoint"
        totalAttempts:
          type: integer

    LeaderboardEntry:
      type: object
      required: [rank, name, xp, level, isCurrentUser]
      properties:
        rank:
          type: integer
        name:
          type: string
        xp:
          type: integer
        level:
          $ref: "#/components/schemas/Level"
        isCurrentUser:
          type: boolean

    OrgRole:
      type: string
      enum: [admin, employee]

    RiskLevel:
      type: string
      enum: [low, medium, high]

    Org:
      type: object
      required: [id, name, ssoDomain, seatLimit, ssoEnabled, ssoProvider]
      properties:
        id:
          type: string
        name:
          type: string
        ssoDomain:
          type: string
          description: >
            The organization's primary email domain, for display. It does NOT
            grant access on its own — membership is invite-only. Domains that
            actually gate SSO live on the SSO connection's allowedDomains.
        seatLimit:
          type: integer
          description: 0 means unlimited
        ssoEnabled:
          type: boolean
          description: Mirrored from the org's SSO connection so this needs no extra read
        ssoProvider:
          type: ["string", "null"]

    CreateOrgInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ssoDomain:
          type: string

    UpdateOrgSettingsInput:
      type: object
      properties:
        name:
          type: string
        ssoDomain:
          type: string
          description: Display only — see Org.ssoDomain. Does not grant access.
        seatLimit:
          type: integer
          description: 0 means unlimited

    OrgMember:
      type: object
      required:
        [id, kind, name, email, role, status, joinedAt, expiresAt, accuracy, riskLevel]
      properties:
        id:
          type: string
          description: >
            A user id when kind="member", an invitation id when
            kind="invitation". The two are not interchangeable.
        kind:
          type: string
          enum: [member, invitation]
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/OrgRole"
        status:
          type: string
          enum: [invited, active, disabled]
        joinedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: When an invitation lapses. Always null for kind="member".
        accuracy:
          type: integer
          description: 0-100, computed from real practice attempts
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"

    InviteMemberInput:
      type: object
      required: [email]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"

    InviteMemberResult:
      type: object
      required: [member, inviteUrl]
      properties:
        member:
          $ref: "#/components/schemas/OrgMember"
        inviteUrl:
          type: string
          description: >
            The accept link. Returned only here and from
            /org/invitations/{id}/link — never in the members list.

    InvitationLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: ["string", "null"]
          format: date-time

    PublicInvitation:
      type: object
      required: [orgName, email, role, expiresAt, ssoAvailable, requiresExistingAccount]
      properties:
        orgName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        expiresAt:
          type: ["string", "null"]
          format: date-time
        ssoAvailable:
          type: boolean
        ssoStartUrl:
          type: ["string", "null"]
        requiresExistingAccount:
          type: boolean
          description: >
            True when a PhishAware account already uses this address. The
            password form is replaced by a sign-in-to-accept prompt, so an
            invitation can never silently absorb someone else's account.

    AcceptInvitationInput:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
          description: Omit entirely to adopt the currently signed-in account instead.

    UpdateMemberRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    TrainingAssignment:
      type: object
      required: [id, title, target, dueDate, requiredScenarios, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        target:
          type: string
          description: '"all" or a specific member''s user id'
        dueDate:
          type: ["string", "null"]
          format: date
        requiredScenarios:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateTrainingInput:
      type: object
      required: [title, target, dueDate]
      properties:
        title:
          type: string
        target:
          type: string
          description: '"all" or a specific member''s user id'
        dueDate:
          type: string
          format: date
        requiredScenarios:
          type: integer

    OrgMemberAccuracy:
      type: object
      required: [name, accuracy, risk]
      properties:
        name:
          type: string
        accuracy:
          type: integer
        risk:
          $ref: "#/components/schemas/RiskLevel"

    OrgAnalytics:
      type: object
      required:
        [avgAccuracy, activeCount, atRisk, riskBands, participationRate, perMember]
      properties:
        avgAccuracy:
          type: integer
        activeCount:
          type: integer
        atRisk:
          type: integer
        riskBands:
          type: object
          required: [low, medium, high]
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
        participationRate:
          type: integer
          description: "% of active members with at least one practice attempt"
        perMember:
          type: array
          items:
            $ref: "#/components/schemas/OrgMemberAccuracy"

    SsoProviderKind:
      type: string
      enum: [okta, entra, google, auth0, generic]

    SsoDiscoverInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SsoDiscovery:
      type: object
      required: [ssoAvailable]
      properties:
        ssoAvailable:
          type: boolean
        orgName:
          type: ["string", "null"]
        providerKind:
          type: ["string", "null"]
        startUrl:
          type: ["string", "null"]
          description: Navigate to this with window.location.href — do not fetch it.

    OrgSsoConnection:
      type: object
      required:
        [configured, serverConfigured, redirectUri, enabled, issuer, clientId,
         hasClientSecret, providerKind, allowedDomains, requireVerifiedEmail,
         lastTestAt, lastTestOk, lastTestError]
      properties:
        configured:
          type: boolean
          description: False when this org has no SSO connection saved yet.
        serverConfigured:
          type: boolean
          description: >
            False when the server has no APP_ENCRYPTION_KEY. SSO cannot be
            configured at all until an operator sets one.
        redirectUri:
          type: string
          description: Paste this into the IdP's allowed redirect URLs, exactly.
        enabled:
          type: boolean
        issuer:
          type: string
        clientId:
          type: string
        hasClientSecret:
          type: boolean
          description: The secret itself is never returned.
        providerKind:
          $ref: "#/components/schemas/SsoProviderKind"
        allowedDomains:
          type: array
          items:
            type: string
        requireVerifiedEmail:
          type: boolean
        lastTestAt:
          type: ["string", "null"]
          format: date-time
        lastTestOk:
          type: ["boolean", "null"]
        lastTestError:
          type: ["string", "null"]

    UpsertOrgSsoConnectionInput:
      type: object
      required: [issuer, clientId, providerKind, allowedDomains]
      properties:
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          description: Omit to keep the stored secret unchanged.
        providerKind:
          $ref: "#/components/schemas/SsoProviderKind"
        allowedDomains:
          type: array
          items:
            type: string
        requireVerifiedEmail:
          type: boolean
        enabled:
          type: boolean

    SsoTestCheck:
      type: object
      required: [id, label, status, detail]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pass, warn, fail]
        detail:
          type: string

    SsoTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SsoTestCheck"
