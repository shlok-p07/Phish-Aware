kind = "web"
previewPath = "/"
title = "PhishAware"
version = "1.0.0"
id = "artifacts/phishaware"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20389

[services.development]
run = "pnpm --filter @workspace/phishaware run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phishaware", "run", "build" ]
serve = "static"
publicDir = "artifacts/phishaware/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20389"
BASE_PATH = "/"
